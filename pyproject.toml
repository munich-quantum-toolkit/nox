[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.13,<0.14" ]


[project]
name = "mqt-nox"
version = "0.1.0"
description = "Common Nox session functions for the Munich Quantum Toolkit"
readme = "README.md"
license = "MIT"
license-files = [ "LICENSE" ]
requires-python = ">=3.11"
classifiers = [
  "Natural Language :: English",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [ "nox>=2026.10.20" ]

[[project.authors]]
name = "Daniel Haag"
email = "daniel.haag@tum.de"

[project.urls]
Homepage = "https://github.com/munich-quantum-toolkit/nox"
Issues = "https://github.com/munich-quantum-toolkit/nox/issues"
Discussions = "https://github.com/munich-quantum-toolkit/nox/discussions"


[dependency-groups]
dev = [ "prek>=0.4.5" ]


[tool.uv]
required-version = ">=0.13.4"

[tool.uv.build-backend]
module-name = "mqt.nox"
source-include = [ "docs/**" ]


[tool.ruff]
line-length = 120
preview = true
fix = true
unsafe-fixes = true
show-fixes = true

[tool.ruff.format]
preview = true
docstring-code-format = true

[tool.ruff.lint.isort]
known-first-party = [ "mqt.nox" ]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint]
select = [ "ALL" ]
ignore = [
  "C90",     # <...> too complex
  "COM812",  # Trailing commas are handled by the formatter
  "CPY001",  # Missing copyright notice at top of file
  "PLR09",   # Too many <...>
  "PLR2004", # Magic value used in comparison
  "PT028",   # Nox session helpers have optional arguments
  "S101",    # Use of assert detected
  "S404",    # `subprocess` module is possibly insecure
  "S603",    # `subprocess` call: check for execution of untrusted input
  "S607",    # Starting a process with a partial executable path
  "T20",     # print statement used
]
future-annotations = true


[tool.check-sdist]
sdist-only = [ "pyproject.toml.orig" ]
git-only = [
  ".gitignore",
  ".license-tools-config.json",
  ".rumdl.toml",
  "CHANGELOG.md",
  "UPGRADING.md",
  "uv.lock",
]


[tool.pyproject-fmt]
generate_python_version_classifiers = false
table_format = "long"
sub_table_spacing = "\n"
separate_root_table = "\n\n"


[tool.ty.terminal]
# Error if ty emits any warning-level diagnostics.
error-on-warning = true
